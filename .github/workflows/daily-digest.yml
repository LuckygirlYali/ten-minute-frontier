name: Publish daily frontier digest

on:
  schedule:
    # Avoid the top of the hour, when GitHub scheduled workflows are most congested.
    # UTC 00:17/01:37 = Beijing 08:17/09:37.
    - cron: "17 0 * * *"
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate a draft without publishing it"
        required: false
        type: boolean
        default: false
      target_date:
        description: "Optional Beijing date for a dry run (YYYY-MM-DD)"
        required: false
        type: string
      degraded_mode:
        description: "Use the smaller recovery request"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-frontier-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      AI_API_KEY: ${{ secrets.OPENTECH_API_KEY }}
      AI_API_BASE_URL: https://api.opentech.top/v1
      OPENAI_DIGEST_MODEL: ${{ vars.OPENAI_DIGEST_MODEL }}
      DIGEST_DEGRADED: ${{ (github.event_name == 'schedule' && github.event.schedule == '37 1 * * *') || inputs.degraded_mode }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Resolve Beijing date
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.target_date }}
        run: |
          today="${REQUESTED_DATE:-$(date +%F)}"
          echo "$today" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "digest=src/data/digests/$today.json" >> "$GITHUB_OUTPUT"
          echo "draft=.tmp/digests/$today.json" >> "$GITHUB_OUTPUT"

      - name: Decide whether generation is needed
        id: state
        env:
          DIGEST: ${{ steps.date.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if test "$DRY_RUN" != "true" && test -f "$DIGEST"; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "The Beijing-date digest already exists; only verification will run."
          else
            test -n "$AI_API_KEY"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify provider capabilities on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-ai-provider.mjs

      - name: Generate a source-grounded draft
        if: steps.state.outputs.generate == 'true'
        env:
          TODAY: ${{ steps.date.outputs.today }}
          DRAFT: ${{ steps.date.outputs.draft }}
        run: node scripts/generate-digest.mjs --date "$TODAY" --output "$DRAFT"

      - name: Report source coverage
        if: always() && steps.state.outputs.generate == 'true'
        run: node scripts/audit-sources.mjs

      - name: Save dry-run draft for editorial review
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: editorial-dry-run
          path: .tmp/digests/*.json
          retention-days: 3
          if-no-files-found: error

      - name: Validate draft and verify every selected link
        if: steps.state.outputs.generate == 'true'
        env:
          DRAFT: ${{ steps.date.outputs.draft }}
        run: |
          node scripts/validate-digests.mjs "$DRAFT"
          python3 skills/ten-minute-frontier-news/scripts/verify_digest_links.py "$DRAFT"

      - name: Promote draft atomically
        if: steps.state.outputs.generate == 'true' && inputs.dry_run != true
        env:
          DRAFT: ${{ steps.date.outputs.draft }}
          DIGEST: ${{ steps.date.outputs.digest }}
        run: mv "$DRAFT" "$DIGEST"

      - name: Run all release gates
        run: |
          node scripts/validate-digests.mjs
          npm test
          npm run build

      - name: Publish only the new digest
        if: steps.state.outputs.generate == 'true' && inputs.dry_run != true
        env:
          DIGEST: ${{ steps.date.outputs.digest }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git restore -- skills/ten-minute-frontier-news/scripts/rss_feeds.json
          git fetch origin main
          if git cat-file -e "origin/main:$DIGEST" 2>/dev/null; then
            echo "Another run already published $DIGEST."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIGEST"
          staged="$(git diff --cached --name-only)"
          test "$staged" = "$DIGEST"
          git commit -m "content(digest): publish $TODAY briefing"
          git rebase origin/main
          git push origin HEAD:main
